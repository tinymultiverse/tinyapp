# Simple Docker Compose for testing with a lightweight OIDC provider
version: '3.8'

services:
  # Lightweight OIDC provider for testing
  oidc-server-mock:
    image: ghcr.io/navikt/mock-oauth2-server:0.5.8
    ports:
      - "9000:8080"
    environment:
      SERVER_PORT: 8080

  # Mock backend service for testing
  mock-backend:
    image: nginx:alpine
    ports:
      - "5001:80"
    volumes:
      - ./test-content:/usr/share/nginx/html:ro
    environment:
      - NGINX_PORT=80