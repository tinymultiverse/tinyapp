apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: jupyterlab-with-tinyapp
  name: jupyterlab-with-tinyapp
  namespace: tinyapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jupyterlab-with-tinyapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jupyterlab-with-tinyapp
      name: jupyterlab-with-tinyapp
    spec:
      containers:
        - name: jupyter
          image: ghcr.io/tinymultiverse/jupyterlab-tinyapp:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: data-volume
              mountPath: /home/jovyan
          env:
            - name: JUPYTER_BASE_URL
              value: /jupyter
            - name: TINY_APP_SERVER_URL
              value: http://tinyapp-server.tinyapp.svc.cluster.local:8889
            - name: APP_PREVIEW_URL # Should be same as url jupyterlab is accessed from
              value: http://tinymultiverse.local
            - name: AI_ENABLED
              value: "false"
            - name: VOLUME_CLAIM_NAME
              value: my-data
            - name: VOLUME_CLAIM_MOUNT_PATH
              value: "/home/jovyan"
            - name: TINY_APP_IMAGE # Ideally should be same as jupyterlab image to ensure consistency
              value: ghcr.io/tinymultiverse/jupyterlab-tinyapp:latest
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 64Mi
        - name: gateway
          image: ghcr.io/tinymultiverse/tinyapp:latest
          imagePullPolicy: Always
          args: ["gateway"]
          env:
            - name: PRIMARY_TARGET_PORT
              value: "8888"
            - name: SECONDARY_TARGET_PATTERN
              value: "/tinyapp/app-preview"
            - name: SECONDARY_TARGET_PORT
              value: "8002"
            - name: METRICS_ENABLED
              value: "false"
            - name: LOG_TYPE
              value: "development"
          resources:
            limits:
              cpu: 150m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: my-data
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterlab-with-tinyapp
  namespace: tinyapp
spec:
  selector:
    app.kubernetes.io/name: jupyterlab-with-tinyapp
  ports:
    - port: 80
      targetPort: 8005
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterlab-with-tinyapp
  namespace: tinyapp
spec:
  rules:
    - host: tinymultiverse.local
      http:
        paths:
          - path: /jupyter
            pathType: Prefix
            backend:
              service:
                name: jupyterlab-with-tinyapp
                port:
                  number: 80